server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: stayhub-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stayhub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:sql666}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: http://localhost:3000
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET:stayhub-uploads}
      region: ${AWS_REGION:us-east-1}